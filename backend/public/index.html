<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    .task-completed h5 {
      text-decoration: line-through;
      color: #6c757d;
    }
    .form-alert {
      display: none;
    }
    .loading-text {
      visibility: hidden;
    }
    .task-links {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Task Manager</h1>
    
    <!-- Form to Add Task -->
    <form class="task-form mb-4">
      <div class="input-group">
        <input type="text" class="form-control task-input" placeholder="Enter task name" required>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </div>
      <div class="form-alert mt-2 alert" role="alert"></div>
    </form>

    <!-- Loading Indicator -->
    <div class="loading-text text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Task List -->
    <div class="tasks"></div>
  </div>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="./browser-app.js"></script>
</body>
</html>
